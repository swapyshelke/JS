<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Account</title>
</head>
<body>
  <form id="accountForm">
    <input type="text" id="customerName" placeholder="Enter name">
    <input type="number" id="balance" placeholder="Initial balance">
    <button id="btn">Create Account</button>

  <form id="depositForm">
    <input type="number" placeholder="Account Number" id="accountNumber">

    <button>Submit</button>
  </form>
